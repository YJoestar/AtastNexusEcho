# NEXUS — local Supabase configuration
#
# This file exists so the JWT posture of every edge function is version
# controlled rather than being a per-function toggle living in a dashboard.
# Nothing here is read by the Vite build; it governs `supabase start`,
# `supabase functions serve` and `supabase functions deploy`.
#
# project_id is intentionally left as the default placeholder. Set it to the
# real project ref before running `supabase link`.

project_id = "nexus-echo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
# Player accounts are created by the Bureau (bureau-operations) with an
# internal address and the Logic Code as the password. Players never sign
# themselves up and never receive a password-reset email, so both paths are off.
enable_reset_password = false

# ---------------------------------------------------------------------------
# Edge functions
# ---------------------------------------------------------------------------
# verify_jwt decides whether the Supabase gateway rejects a request before the
# function runs.
#
#   true  -> the gateway validates the bearer token. Correct for every function
#            that reads or writes game data.
#   false -> the function must do its own verification. Required only for
#            player-login, which is how a player obtains a token in the first
#            place and therefore cannot present one.
#
# Every function additionally verifies the session itself via
# requireVerifiedUser() in _shared/auth.ts, so the posture here is defence in
# depth rather than the only check. That matters because a dashboard-only
# setting is invisible to review and to CI.
# ---------------------------------------------------------------------------
[functions.player-login]
verify_jwt = false

[functions.admin-check]
verify_jwt = true

[functions.bureau-operations]
verify_jwt = true

[functions.game-bureau-ops]
verify_jwt = true

[functions.game-get-node]
verify_jwt = true

[functions.game-get-state]
verify_jwt = true

[functions.game-inventory]
verify_jwt = true

[functions.game-leaderboard]
verify_jwt = true

[functions.game-mark-read]
verify_jwt = true

[functions.game-node-progress]
verify_jwt = true

[functions.game-notifications]
verify_jwt = true

[functions.game-scan-qr]
verify_jwt = true

[functions.game-submit]
verify_jwt = true

[functions.game-use-hint]
verify_jwt = true

[realtime]
enabled = true